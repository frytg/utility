# adapted from https://github.com/denoland/std/blob/main/.github/workflows/workspace_publish.yml

name: Publish to JSR

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Format
        run: deno fmt --check

      #      - name: Test
      #        run: deno task test

      - name: Publish to JSR
        run: deno publish