# Spindle docs: https://docs.tangled.org/spindles#spindles

when:
  - event: ["push", "manual"]
    branch: ["**"]

engine: microvm
image: alpine

steps:
  - name: "Install mise"
    command: |
      apk add --no-cache bash curl
      curl -fsSL https://github.com/jdx/mise/releases/latest/download/mise-latest-linux-x64-musl.tar.gz | tar -xz -C /usr/local/bin
      mise --version
  - name: "Install dependencies"
    command: mise install
  - name: "Lint"
    command: |
      set -euo pipefail
      mise exec -- just lint